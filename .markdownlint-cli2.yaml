# https://github.com/DavidAnson/markdownlint-cli2
config:
  default: true
  MD013: false # line-length: prose and tables are allowed to be long
  MD033: false # inline HTML: needed for badges and <img> demo GIFs
  MD036: false # short bold labels above tables are intentional
  MD041: false # first line need not be a heading (badge block comes first)
  MD049: false # mixed * and _ emphasis is fine
  MD050: false # mixed ** and __ strong is fine
globs:
  - "**/*.md"
ignores:
  - "build/**"
  - "install/**"
  - "log/**"
